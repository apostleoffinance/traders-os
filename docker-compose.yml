services:
  postgres:
    image: postgres:16-alpine
    container_name: trader-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader}
      POSTGRES_DB: ${POSTGRES_DB:-trader_os}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - trader_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trader_os}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trader_os_pgdata:
